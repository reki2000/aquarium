<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aqualium</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e8eee9; overflow: hidden; }
      canvas { display: block; }
      #status { position: fixed; left: 12px; bottom: 10px; color: #40564f; font: 12px/1.4 system-ui, sans-serif; pointer-events: none; }
      #licenses { position: fixed; right: 12px; bottom: 10px; color: #40564f; font: 12px/1.4 system-ui, sans-serif; }
      #loading { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background: #e8eee9; color: #253d38; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      #loading[hidden] { display: none; }
      #loading .panel { padding: 24px; }
      #loading h1 { margin: 12px 0; font-size: 24px; }
      #loading-message { margin: 0; }
      #loading-hint { color: #637b72; font-size: 13px; }
      #loading-spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #c7d8d1; border-top-color: #327d6b; border-radius: 50%; animation: spin 1s linear infinite; }
      #loading-spinner[hidden] { display: none; }
      #loading-retry { padding: 8px 18px; border: 1px solid #8cd8cb; border-radius: 6px; background: #16332e; color: #dce9ec; font: inherit; cursor: pointer; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #loading-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite" aria-atomic="true">
      <div class="panel">
        <span id="loading-spinner" aria-hidden="true"></span>
        <h1 id="loading-title">Preparing your aquarium</h1>
        <p id="loading-message">Loading the app…</p>
        <p id="loading-hint">The first launch may take a little longer.</p>
        <button id="loading-retry" type="button" hidden>Reload</button>
      </div>
    </div>
    <div id="status"></div>
    <a id="licenses" href="./THIRD-PARTY-LICENSES.txt" target="_blank" rel="noopener">Licenses &amp; credits</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
